<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Training Load Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --text: #e6e8eb; --muted: #9aa1ab;
    --accent: #4f8cff; --good: #3ecf8e; --warn: #f5a623; --bad: #ef5350; --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { background: none; border: none; color: var(--muted); padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; height: 320px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--card); }
  tr:last-child td { border-bottom: none; }
  .status-below { color: var(--warn); }
  .status-within { color: var(--good); }
  .status-above { color: var(--accent); }
  .table-wrap { max-height: 500px; overflow: auto; border-radius: 8px; }
  .calendar-header { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .calendar-header button { background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 18px; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; }
  .calendar-header button:disabled { opacity: 0.35; cursor: default; }
  .calendar-header h2 { margin: 0; min-width: 180px; text-align: center; }
  .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font-size: 12px; text-align: center; }
  .calendar-day { background: var(--card); border: 1px solid var(--border); border-radius: 8px; min-height: 88px; padding: 6px; font-size: 12px; }
  .calendar-day.empty { background: none; border: none; }
  .calendar-day .day-num { color: var(--muted); }
  .calendar-day .icons { font-size: 26px; margin-top: 6px; text-align: center; line-height: 1.3; }
  .calendar-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .section-note { color: var(--muted); font-size: 13px; text-align: center; margin: -8px 0 16px; }
  h3.section-title { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 10px; }
</style>
</head>
<body>

<header>
  <h1>Training Load Dashboard</h1>
  <p id="subtitle">Loading…</p>
</header>

<nav>
  <button data-section="overview" class="active">Overview</button>
  <button data-section="daily">Daily</button>
  <button data-section="weekly">Weekly</button>
  <button data-section="monthly">Monthly</button>
  <button data-section="yearly">Year in Review</button>
  <button data-section="trends">Fitness Trends</button>
  <button data-section="calendar">Calendar</button>
  <button data-section="activities">Activities</button>
</nav>

<main>
  <section id="overview" class="active">
    <div class="cards" id="overview-cards"></div>
    <div class="chart-box"><canvas id="overview-chart"></canvas></div>
  </section>

  <section id="daily">
    <div class="calendar-header">
      <button id="daily-summary-prev">‹</button>
      <h2 id="daily-summary-label"></h2>
      <button id="daily-summary-next">›</button>
    </div>
    <div class="cards" id="daily-summary-cards"></div>

    <div class="chart-box"><canvas id="daily-chart"></canvas></div>
    <div class="chart-box"><canvas id="daily-minutes-chart"></canvas></div>
    <div class="table-wrap"><table id="daily-table"></table></div>
  </section>

  <section id="weekly">
    <div class="calendar-header">
      <button id="weekly-summary-prev">‹</button>
      <h2 id="weekly-summary-label"></h2>
      <button id="weekly-summary-next">›</button>
    </div>
    <div class="cards" id="weekly-summary-cards"></div>

    <div class="chart-box"><canvas id="weekly-chart"></canvas></div>
    <div class="chart-box"><canvas id="weekly-minutes-chart"></canvas></div>
    <div class="table-wrap"><table id="weekly-table"></table></div>
  </section>

  <section id="monthly">
    <div class="calendar-header">
      <button id="month-summary-prev">‹</button>
      <h2 id="month-summary-label"></h2>
      <button id="month-summary-next">›</button>
    </div>
    <div class="cards" id="month-summary-cards"></div>

    <div class="chart-box"><canvas id="monthly-chart"></canvas></div>
    <div class="chart-box"><canvas id="monthly-minutes-chart"></canvas></div>
    <div class="table-wrap"><table id="monthly-table"></table></div>
  </section>

  <section id="yearly">
    <div class="calendar-header">
      <button id="year-summary-prev">‹</button>
      <h2 id="year-summary-label"></h2>
      <button id="year-summary-next">›</button>
    </div>
    <p class="section-note" id="year-summary-note"></p>
    <div class="cards" id="year-summary-cards"></div>

    <h3 class="section-title">Highlights</h3>
    <div class="cards" id="year-highlight-cards"></div>

    <div class="chart-box"><canvas id="yearly-hours-chart"></canvas></div>
    <h3 class="section-title">By activity type</h3>
    <div class="table-wrap" style="margin-bottom:20px"><table id="yearly-types-table"></table></div>
  </section>

  <section id="trends">
    <div class="chart-box"><canvas id="weight-chart"></canvas></div>
    <div class="chart-box"><canvas id="body-comp-chart"></canvas></div>
    <div class="chart-box"><canvas id="power-chart"></canvas></div>
    <div class="chart-box"><canvas id="pace-chart"></canvas></div>
  </section>

  <section id="calendar">
    <div class="calendar-header">
      <button id="cal-prev">‹</button>
      <h2 id="cal-label"></h2>
      <button id="cal-next">›</button>
    </div>
    <div class="calendar-weekdays">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div class="calendar-legend" id="calendar-legend"></div>
  </section>

  <section id="activities">
    <div class="table-wrap"><table id="activities-table"></table></div>
  </section>
</main>

<script>
const DATA_BASE = "data";

async function loadJSON(name) {
  const res = await fetch(`${DATA_BASE}/${name}.json`);
  if (!res.ok) throw new Error(`Failed to load ${name}.json`);
  return res.json();
}

function fmt(n, digits = 0) {
  if (n === null || n === undefined) return "—";
  return Number(n).toFixed(digits);
}

function fmtPct(n) {
  return n === null || n === undefined ? "—" : `${fmt(n, 1)}%`;
}

function fmtInt(n) {
  return n === null || n === undefined ? "—" : Math.round(n).toLocaleString();
}

// Signed change between the first and last reading of a period, e.g.
// "−3.2 kg over the year". Empty when either end is missing.
function changeText(start, end, unit, digits = 1) {
  if (start === null || start === undefined || end === null || end === undefined) return "";
  const diff = end - start;
  const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
  return `${sign}${Math.abs(diff).toFixed(digits)}${unit} over the year`;
}

function formatPace(minPerKm) {
  if (minPerKm === null || minPerKm === undefined || !isFinite(minPerKm)) return "—";
  const totalSeconds = Math.round(minPerKm * 60);
  const min = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;
  return `${min}:${String(sec).padStart(2, "0")} /km`;
}

function statusClass(status) {
  if (status === "below_target") return "status-below";
  if (status === "above_target") return "status-above";
  if (status === "within_target") return "status-within";
  return "";
}

function buildTable(tableEl, rows, columns) {
  const thead = `<thead><tr>${columns.map(c => `<th>${c.label}</th>`).join("")}</tr></thead>`;
  const tbody = `<tbody>${rows.map(row => `<tr>${columns.map(c => {
    const raw = row[c.key];
    const display = c.format ? c.format(raw, row) : (raw ?? "—");
    const cls = c.statusClass ? statusClass(row[c.statusClass]) : "";
    return `<td class="${cls}">${display}</td>`;
  }).join("")}</tr>`).join("")}</tbody>`;
  tableEl.innerHTML = thead + tbody;
}

function lineDataset(label, data, color, extra = {}) {
  return { label, data, borderColor: color, backgroundColor: color, pointRadius: 0, tension: 0.2, ...extra };
}

function targetBandChart(canvasId, labels, actual, targetMin, targetMax, barLabel, barColor, title) {
  new Chart(document.getElementById(canvasId), {
    data: {
      labels,
      datasets: [
        { type: "bar", label: barLabel, data: actual, backgroundColor: barColor },
        { type: "line", label: "Target min", data: targetMin, borderColor: "#9aa1ab", borderDash: [4, 4], pointRadius: 0 },
        { type: "line", label: "Target max", data: targetMax, borderColor: "#9aa1ab", borderDash: [4, 4], pointRadius: 0 },
      ],
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: title } } },
  });
}

// Shared progress bar for any KPI card with a defined target band (currently:
// exercise calories and exercise minutes, at daily/weekly/monthly grain).
// Below target = orange, within the target band = green, above target = blue.
function progressBarHTML(current, min, max) {
  if (min == null || max == null || current == null) return "";
  const pct = Math.max(0, Math.min(100, (current / max) * 100));
  const minPct = Math.max(0, Math.min(100, (min / max) * 100));
  let color = "var(--warn)";
  if (current >= min && current <= max) color = "var(--good)";
  else if (current > max) color = "var(--accent)";
  return `<div style="background:#2a2e37;border-radius:4px;height:6px;margin-top:8px;position:relative;overflow:hidden">
    <div style="position:absolute;left:${minPct}%;top:0;width:2px;height:100%;background:#9aa1ab"></div>
    <div style="background:${color};height:100%;width:${pct}%"></div>
  </div>`;
}

const ACTIVITY_ICONS = {
  Ride: "🚴", VirtualRide: "🚴🖥️",
  Run: "🏃", VirtualRun: "🏃🖥️", TrailRun: "🥾",
  Walk: "🚶", WeightTraining: "🏋️", Yoga: "🧘", Tennis: "🎾", Workout: "💪",
};
const DEFAULT_ICON = "⚡";

let calendarState = { year: null, month: null };
let activitiesByDate = {};
let dailyByDate = {};

function buildCalendarLookups(activities, daily) {
  activitiesByDate = {};
  activities.forEach(a => {
    const d = a.activity_date.slice(0, 10);
    if (!activitiesByDate[d]) activitiesByDate[d] = [];
    activitiesByDate[d].push(a);
  });
  dailyByDate = {};
  daily.forEach(d => { dailyByDate[d.calendar_date.slice(0, 10)] = d; });
}

function renderCalendar() {
  const { year, month } = calendarState;
  document.getElementById("cal-label").textContent =
    new Date(year, month, 1).toLocaleString("default", { month: "long", year: "numeric" });

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  for (let i = 0; i < startOffset; i++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day empty";
    grid.appendChild(cell);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const cell = document.createElement("div");
    cell.className = "calendar-day";

    const dayActs = activitiesByDate[dateStr] || [];
    const dailyRow = dailyByDate[dateStr];
    const icons = dayActs.map(a => ACTIVITY_ICONS[a.activity_type] || DEFAULT_ICON).join(" ");

    let tooltip = dateStr;
    if (dayActs.length) {
      tooltip += "\n" + dayActs.map(a => `${a.activity_type}: ${a.activity_name}`).join("\n");
    } else if (dailyRow && !dailyRow.is_active_day) {
      tooltip += "\nRest day";
    }
    if (dailyRow) tooltip += `\nCalories: ${dailyRow.total_calories ?? 0}`;
    cell.title = tooltip;

    cell.innerHTML = `<div class="day-num">${day}</div><div class="icons">${icons}</div>`;
    grid.appendChild(cell);
  }
}

document.getElementById("cal-prev").addEventListener("click", () => {
  calendarState.month -= 1;
  if (calendarState.month < 0) { calendarState.month = 11; calendarState.year -= 1; }
  renderCalendar();
});
document.getElementById("cal-next").addEventListener("click", () => {
  calendarState.month += 1;
  if (calendarState.month > 11) { calendarState.month = 0; calendarState.year += 1; }
  renderCalendar();
});

// Duration-weighted mean: e.g. avg power across rides, weighted by moving time,
// so a 10-minute spin doesn't count the same as a 3-hour ride. Mirrors the
// avg_heartrate_weighted convention already used in mart_monthly_training.sql.
function weightedAvg(items, valueKey, weightKey) {
  let num = 0, den = 0;
  items.forEach(item => {
    const v = item[valueKey], w = item[weightKey];
    if (v === null || v === undefined || !w) return;
    num += v * w;
    den += w;
  });
  return den > 0 ? num / den : null;
}

// Ratio of totals: e.g. overall pace = total time / total distance across all
// runs in the period. This avoids the "average of ratios" pitfall where a
// short fast run and a long slow run would otherwise count equally regardless
// of distance.
function ratioOfTotals(items, numKey, denKey) {
  let num = 0, den = 0;
  items.forEach(item => {
    const n = item[numKey], d = item[denKey];
    if (n === null || n === undefined || !d) return;
    num += n;
    den += d;
  });
  return den > 0 ? num / den : null;
}

function computeActivityAverages(acts) {
  const cyclingActs = acts.filter(a =>
    (a.activity_type === "Ride" || a.activity_type === "VirtualRide") && a.weighted_avg_watts);
  const runActs = acts.filter(a =>
    ["Run", "VirtualRun", "TrailRun"].includes(a.activity_type) && a.distance_km && a.moving_time_min);
  return {
    avgPower: weightedAvg(cyclingActs, "weighted_avg_watts", "moving_time_min"),
    avgPace: ratioOfTotals(runActs, "moving_time_min", "distance_km"),
  };
}

function addDaysISO(dateStr, days) {
  const d = new Date(dateStr.slice(0, 10) + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  return new Date(dateStr.slice(0, 10) + "T00:00:00Z").toLocaleDateString("default", {
    weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: "UTC",
  });
}

function formatShortDate(dateStr) {
  return new Date(dateStr.slice(0, 10) + "T00:00:00Z").toLocaleDateString("default", {
    year: "numeric", month: "short", day: "numeric", timeZone: "UTC",
  });
}

function formatMonthLabel(dateStr) {
  return new Date(dateStr.slice(0, 10) + "T00:00:00Z").toLocaleDateString("default", {
    month: "long", year: "numeric", timeZone: "UTC",
  });
}

function dailySummaryCards(row, acts) {
  const { avgPower, avgPace } = computeActivityAverages(acts);
  return [
    { label: "Activities", value: row.activity_count },
    {
      label: "Total minutes", value: fmt(row.total_moving_time_min),
      extra: progressBarHTML(row.total_moving_time_min, row.exercise_minutes_target_min, row.exercise_minutes_target_max),
    },
    {
      label: "Total calories", value: fmt(row.total_calories),
      extra: progressBarHTML(row.total_calories, row.exercise_calorie_target_min, row.exercise_calorie_target_max),
    },
    { label: "Avg power", value: avgPower !== null ? `${fmt(avgPower)} W` : "—" },
    { label: "Avg pace", value: avgPace !== null ? formatPace(avgPace) : "—" },
    { label: "Weight", value: row.weight_kg ? `${fmt(row.weight_kg, 1)} kg` : "—" },
    { label: "Body fat", value: fmtPct(row.body_fat_pct) },
    { label: "Muscle mass", value: fmtPct(row.muscle_mass_pct) },
    { label: "Fitness (CTL)", value: fmt(row.ctl, 1) },
    { label: "Fatigue (ATL)", value: fmt(row.atl, 1) },
    { label: "Form (TSB)", value: fmt(row.tsb, 1) },
  ];
}

function weeklySummaryCards(row, acts) {
  const { avgPower, avgPace } = computeActivityAverages(acts);
  return [
    { label: "Active days", value: `${row.active_days} / ${row.days_in_week}` },
    { label: "Total activities", value: acts.length },
    {
      label: "Total hours", value: fmt(row.total_moving_time_hours, 1),
      extra: progressBarHTML(row.total_moving_time_hours * 60, row.exercise_minutes_target_min, row.exercise_minutes_target_max),
    },
    {
      label: "Total calories", value: fmt(row.total_calories),
      extra: progressBarHTML(row.total_calories, row.exercise_calorie_target_min, row.exercise_calorie_target_max),
    },
    { label: "Avg power", value: avgPower !== null ? `${fmt(avgPower)} W` : "—" },
    { label: "Avg pace", value: avgPace !== null ? formatPace(avgPace) : "—" },
    { label: "Avg weight", value: row.avg_weight_kg ? `${fmt(row.avg_weight_kg, 1)} kg` : "—" },
    { label: "Avg body fat", value: fmtPct(row.avg_body_fat_pct) },
    { label: "Avg muscle mass", value: fmtPct(row.avg_muscle_mass_pct) },
    { label: "Fitness (CTL)", value: fmt(row.avg_ctl, 1) },
    { label: "Fatigue (ATL)", value: fmt(row.avg_atl, 1) },
    { label: "Form (TSB)", value: fmt(row.avg_tsb, 1) },
  ];
}

function monthlySummaryCards(row, acts) {
  const { avgPower, avgPace } = computeActivityAverages(acts);
  return [
    { label: "Active days", value: `${row.active_days} / ${row.days_in_month}` },
    { label: "Total activities", value: acts.length },
    {
      label: "Total hours", value: fmt(row.total_moving_time_hours, 1),
      extra: progressBarHTML(row.total_moving_time_hours * 60, row.exercise_minutes_target_min, row.exercise_minutes_target_max),
    },
    {
      label: "Total calories", value: fmt(row.total_calories),
      extra: progressBarHTML(row.total_calories, row.exercise_calorie_target_min, row.exercise_calorie_target_max),
    },
    { label: "Avg power", value: avgPower !== null ? `${fmt(avgPower)} W` : "—" },
    { label: "Avg pace", value: avgPace !== null ? formatPace(avgPace) : "—" },
    { label: "Avg weight", value: row.avg_weight_kg ? `${fmt(row.avg_weight_kg, 1)} kg` : "—" },
    { label: "Avg body fat", value: fmtPct(row.avg_body_fat_pct) },
    { label: "Avg muscle mass", value: fmtPct(row.avg_muscle_mass_pct) },
    { label: "Fitness (CTL)", value: fmt(row.avg_ctl, 1) },
    { label: "Fatigue (ATL)", value: fmt(row.avg_atl, 1) },
    { label: "Form (TSB)", value: fmt(row.avg_tsb, 1) },
  ];
}

function yearlySummaryCards(row) {
  return [
    { label: "Activities", value: fmtInt(row.total_activities) },
    { label: "Active days", value: `${row.active_days} / ${row.days_tracked}` },
    { label: "Total hours", value: fmt(row.total_moving_time_hours, 1) },
    { label: "Total calories", value: fmtInt(row.total_calories) },
    { label: "Total distance", value: `${fmtInt(row.total_distance_km)} km` },
    { label: "Elevation gain", value: `${fmtInt(row.total_elevation_gain_m)} m` },
    { label: "Training load", value: fmtInt(row.total_training_load) },
    { label: "Peak fitness (CTL)", value: fmt(row.peak_ctl, 1), sub: `avg ${fmt(row.avg_ctl, 1)}` },
    { label: "Weight", value: row.end_weight_kg ? `${fmt(row.end_weight_kg, 1)} kg` : "—", sub: changeText(row.start_weight_kg, row.end_weight_kg, " kg") },
    { label: "Body fat", value: fmtPct(row.end_body_fat_pct), sub: changeText(row.start_body_fat_pct, row.end_body_fat_pct, " pts") },
    { label: "Muscle mass", value: fmtPct(row.end_muscle_mass_pct), sub: changeText(row.start_muscle_mass_pct, row.end_muscle_mass_pct, " pts") },
  ];
}

function longestStreak(dailyRows) {
  let best = 0, current = 0;
  dailyRows.forEach(d => { current = d.is_active_day ? current + 1 : 0; best = Math.max(best, current); });
  return best;
}

function maxBy(items, key) {
  return items.reduce((best, item) => (item[key] ?? -Infinity) > (best?.[key] ?? -Infinity) ? item : best, null);
}

function groupByType(acts) {
  const groups = {};
  acts.forEach(a => {
    const g = groups[a.activity_type] ??= { activity_type: a.activity_type, count: 0, minutes: 0, distance_km: 0, calories: 0, elevation_gain_m: 0 };
    g.count += 1;
    g.minutes += a.moving_time_min || 0;
    g.distance_km += a.distance_km || 0;
    g.calories += a.calories || 0;
    g.elevation_gain_m += a.elevation_gain_m || 0;
  });
  return Object.values(groups).sort((a, b) => b.minutes - a.minutes);
}

function yearHighlightCards(acts, yearDaily, yearWeekly) {
  const longest = maxBy(acts, "moving_time_min");
  const farthest = maxBy(acts, "distance_km");
  const biggestBurn = maxBy(acts, "calories");
  const bestWeek = maxBy(yearWeekly, "total_moving_time_hours");
  const topType = groupByType(acts)[0];
  const actSub = a => a ? `${a.activity_name} · ${formatShortDate(a.activity_date)}` : "";
  return [
    { label: "Longest session", value: longest ? `${fmt(longest.moving_time_min / 60, 1)} h` : "—", sub: actSub(longest) },
    { label: "Longest distance", value: farthest?.distance_km ? `${fmt(farthest.distance_km, 1)} km` : "—", sub: farthest?.distance_km ? actSub(farthest) : "" },
    { label: "Biggest calorie burn", value: biggestBurn?.calories ? fmtInt(biggestBurn.calories) : "—", sub: biggestBurn?.calories ? actSub(biggestBurn) : "" },
    { label: "Biggest week", value: bestWeek ? `${fmt(bestWeek.total_moving_time_hours, 1)} h` : "—", sub: bestWeek ? `week of ${formatShortDate(bestWeek.week_start)}` : "" },
    { label: "Longest active streak", value: `${longestStreak(yearDaily)} days` },
    { label: "Most time spent", value: topType ? `${ACTIVITY_ICONS[topType.activity_type] || DEFAULT_ICON} ${fmt(topType.minutes / 60, 1)} h` : "—", sub: topType ? `${topType.activity_type} · ${topType.count} sessions` : "" },
  ];
}

function cardsHTML(cards) {
  return cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div>${c.sub ? `<div class="sub">${c.sub}</div>` : ""}${c.extra || ""}</div>`
  ).join("");
}

let yearlyHoursChart = null;

function renderYearDetails(row, acts, { daily, weekly, monthly }) {
  const year = String(row.year);
  const yearDaily = daily.filter(d => d.calendar_date.startsWith(year));
  const yearWeekly = weekly.filter(w => w.week_start.startsWith(year));
  const yearMonthly = monthly.filter(m => m.month.startsWith(year));

  const notes = [];
  if (row.first_tracked_date.slice(5, 10) !== "01-01") notes.push(`Tracked from ${formatShortDate(row.first_tracked_date)}`);
  if (row.last_tracked_date.slice(5, 10) !== "12-31") notes.push(`year to date (${formatShortDate(row.last_tracked_date)})`);
  document.getElementById("year-summary-note").textContent = notes.join(" · ");

  document.getElementById("year-highlight-cards").innerHTML = cardsHTML(yearHighlightCards(acts, yearDaily, yearWeekly));

  if (yearlyHoursChart) yearlyHoursChart.destroy();
  yearlyHoursChart = new Chart(document.getElementById("yearly-hours-chart"), {
    type: "bar",
    data: {
      labels: yearMonthly.map(m => new Date(m.month.slice(0, 10) + "T00:00:00Z").toLocaleDateString("default", { month: "short", timeZone: "UTC" })),
      datasets: [{ label: "Hours", data: yearMonthly.map(m => m.total_moving_time_hours), backgroundColor: "#4f8cff", borderRadius: 4 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: "Training hours by month" } },
    },
  });

  buildTable(document.getElementById("yearly-types-table"), groupByType(acts), [
    { key: "activity_type", label: "Type", format: v => `${ACTIVITY_ICONS[v] || DEFAULT_ICON} ${v}` },
    { key: "count", label: "Sessions" },
    { key: "minutes", label: "Hours", format: v => fmt(v / 60, 1) },
    { key: "distance_km", label: "Distance (km)", format: v => v ? fmt(v, 1) : "—" },
    { key: "elevation_gain_m", label: "Elevation (m)", format: v => v ? fmtInt(v) : "—" },
    { key: "calories", label: "Calories", format: v => v ? fmtInt(v) : "—" },
  ]);
}

// Generic toggleable period-summary panel, shared by the Daily, Weekly, and
// Monthly tabs. `rows` must be pre-sorted ascending by date (all three marts
// already are). Navigation moves by array index rather than recomputing
// calendar dates, so there's no month/week rollover arithmetic to get wrong.
function buildPeriodSummary({ rows, activities, dateFilter, formatLabel, buildCards, els, onRender }) {
  let index = rows.length - 1;

  function render() {
    const row = rows[index];
    els.label.textContent = formatLabel(row);
    const periodActs = activities.filter(a => dateFilter(row, a));
    els.cards.innerHTML = cardsHTML(buildCards(row, periodActs));
    if (onRender) onRender(row, periodActs);
    els.prev.disabled = index <= 0;
    els.next.disabled = index >= rows.length - 1;
  }

  els.prev.addEventListener("click", () => { if (index > 0) { index -= 1; render(); } });
  els.next.addEventListener("click", () => { if (index < rows.length - 1) { index += 1; render(); } });

  render();
}
